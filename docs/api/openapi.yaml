        - latitude
        - isDefault
      properties:
        id:
          $ref: "#/components/schemas/Id"
        contactName:
          type: string
          minLength: 1
          maxLength: 40
        contactPhone:
          type: string
          minLength: 1
          maxLength: 11
          pattern: ^1[0-9]{10}$
        provinceCode:
          type: string
          minLength: 1
          maxLength: 6
        provinceName:
          type: string
          minLength: 1
          maxLength: 40
        cityCode:
          type: string
          minLength: 1
          maxLength: 6
        cityName:
          type: string
          minLength: 1
          maxLength: 40
        districtCode:
          type: string
          minLength: 1
