      type: object
      additionalProperties: false
      description: 无门牌、电话、开始码。仅事件相关且有权限的用户收到；优惠池事件需按人员资格过滤。reason 用于关闭或失败。
      required:
        - status
        - currentPrice
      properties:
        status:
          $ref: "#/components/schemas/OrderStatus"
        currentPrice:
          $ref: "#/components/schemas/Money"
        reason:
          type: string
          minLength: 1
          maxLength: 300
    WsEvent:
      type: object
      additionalProperties: false
      description: 同源
        /ws，仅通知，事务提交后发送。OFFER_CREATED=新优惠单；OFFER_PRICE_CHANGED=变价；ORDER_CLAIMED=被抢；ORDER_CLOSED=取消/超时；DISPATCH_SUCCEEDED/FAILED=标准调度结果；ORDER_STATUS_CHANGED=履约变化。客户收本人订单；人员收本人分配及有资格的池事件；管理员收管理事件。允许丢失/重复/乱序，eventId
        去重，priceVersion 不得回退；断线、重连、重新登录必须 HTTP 重查，不以推送作为状态裁决。
      required:
        - eventId
        - type
        - orderId
        - priceVersion
        - occurredAt
        - payload
      properties:
        eventId:
          $ref: "#/components/schemas/Id"
        type:
          $ref: "#/components/schemas/WsEventType"
        orderId:
          $ref: "#/components/schemas/Id"
        priceVersion:
          type: integer
          minimum: 1
          maximum: 2147483647
        occurredAt:
          $ref: "#/components/schemas/DateTime"
        payload:
          $ref: "#/components/schemas/WsOrderPayload"
      example:
        eventId: "9001"
        type: OFFER_PRICE_CHANGED
        orderId: "10001"
        priceVersion: 2
        occurredAt: 2026-10-03T10:00:00+08:00
        payload:
          status: WAITING_ACCEPTANCE
          currentPrice: "135.00"
