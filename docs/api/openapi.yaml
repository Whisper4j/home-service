openapi: 3.0.3
info:
  title: 家政预约与调度平台
  version: 1.0.0
  description: |-
    本文件为唯一正式接口契约。平台管理型、单SKU单人员，三端独立角色。所有 HTTP 接口相对 servers=/api；成功 code=SUCCESS，失败使用真实HTTP状态和字符串业务码。分页默认1/20，最大100，空页list=[]、total=0、pages=0；超末页返回空list但保留真实total/pages。未知JSON字段拒绝，字符串去除两侧空白后校验（密码不裁剪）。所有 ID 十进制字符串、金额两位小数字符串，日期时间 Asia/Shanghai +08:00。

    并发最终由MySQL订单条件更新、按时间排序的全部槽条件更新和事务裁决；Redis/推送不能作为唯一保障。SERVICE与BUFFER完整可用才可分配，标准尾部缓冲120分钟、优惠60分钟，全部槽须在工作区间内。时间窗边界：最早/最远/优惠提前量取包含，支付/报价/抢单在 now>=deadline 时拒绝并执行到期处理。

    状态路径：PENDING_PAYMENT→WAITING_DISPATCH(标准)或WAITING_ACCEPTANCE(优惠)→PENDING_SERVICE→DEPARTED→ARRIVED→IN_SERVICE→PENDING_CONFIRMATION→COMPLETED；允许的取消分支→CANCELLED。支付独立UNPAID/PAID/PARTIALLY_REFUNDED/REFUNDED，调度独立NOT_REQUIRED/PENDING/SUCCEEDED/FAILED；取消已分配订单保留调度成功历史。

    错误码与HTTP：400 VALIDATION_ERROR；401 UNAUTHENTICATED/TOKEN_EXPIRED/INVALID_CREDENTIALS；403 FORBIDDEN/ACCOUNT_DISABLED；404 NOT_FOUND；409 USERNAME_EXISTS/IDEMPOTENCY_CONFLICT/REQUEST_IN_PROGRESS/STATE_CONFLICT/PRICE_CHANGED/SLOT_CONFLICT/SCHEDULE_CONFLICT/OFFER_CLOSED/ORDER_TAKEN/REVIEW_EXISTS/RESOURCE_IN_USE/CONFIG_CONFLICT；422 PRICE_OUT_OF_RANGE/OUTSIDE_SERVICE_AREA/BOOKING_WINDOW_INVALID/OFFER_NOT_SUPPORTED/WORKER_INELIGIBLE/START_CODE_INVALID/CATALOG_UNAVAILABLE；500 INTERNAL_ERROR。

    WebSocket不作为OpenAPI HTTP path。连接同源 /ws，首帧 WsAuthFrame，成功 WsAuthAck；随后 WsEvent。握手后认证前不推送数据，业务通知在事务提交后发送，重连必须重新HTTP查询。各事件共用隐私最小化 WsOrderPayload；不接受WebSocket业务写操作。
servers:
  - url: /api
    description: 同源，由Nginx代理；不硬编码后端主机
tags:
  - name: customer
    description: 客户接口
  - name: worker
    description: 服务人员接口
  - name: admin
    description: 管理员接口
security:
