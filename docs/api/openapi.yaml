        - contactPhone
        - provinceCode
        - provinceName
        - cityCode
        - cityName
        - districtCode
        - districtName
        - detail
        - isDefault
      properties:
        contactName:
          type: string
          minLength: 1
          maxLength: 40
        contactPhone:
          type: string
          minLength: 1
          maxLength: 11
          pattern: ^1[0-9]{10}$
        provinceCode:
          type: string
          minLength: 1
          maxLength: 6
        provinceName:
          type: string
          minLength: 1
          maxLength: 40
        cityCode:
          type: string
          minLength: 1
          maxLength: 6
        cityName:
          type: string
          minLength: 1
          maxLength: 40
        districtCode:
          type: string
          minLength: 1
          maxLength: 6
        districtName:
          type: string
          minLength: 1
          maxLength: 40
        detail:
          type: string
          minLength: 1
          maxLength: 200
        isDefault:
          type: boolean
    AddressVO:
      type: object
