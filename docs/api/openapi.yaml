        - customer
      operationId: customerGetSceneImage
      summary: 鉴权读取现场图片内容
      description: "图片流成功响应是统一 JSON 响应的唯一例外：返回二进制图片、准确 Content-Type、Cache-Control:
        private, no-store 和 X-Content-Type-Options: nosniff。失败仍返回统一
        ErrorResponse。必须 JWT/角色/账号启用校验，禁止公开 URL
        和无权限列表。客户仅本人图片；服务人员必须为当前订单已分配人员，或订单仍待抢单且当前满足全部接单资格；管理员仅可读取指定订单已关联图片。人员/\
        管理员必须提供
        orderId，图片必须属于该订单。每次读取重新判权（接单、取消、排班变化后不再有抢单资格即拒绝）。不存在或无权均404。前端通过 Bearer
        fetch 得到 Blob 后创建临时对象 URL，退出/离页撤销。"
      responses:
        "200":
          description: 授权图片内容（无 JSON 包裹）
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - private, no-store
            X-Content-Type-Options:
              schema:
                type: string
                enum:
                  - nosniff
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "422":
          $ref: "#/components/responses/Error422"
        "500":
          $ref: "#/components/responses/Error500"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Id"
        - name: orderId
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Id"
      x-query-schema: SceneImageQuery
