        - worker
      operationId: updateWorkerContact
      summary: 修改本人联系电话
      description: 校验JWT、人员角色与启用账号；只操作/统计本人。 写操作必须携带Idempotency-Key，校验、变更和幂等结果在同一事务内。
      responses:
