        - newPrice
        - expectedPrice
        - priceVersion
        - confirmSimulatedPayment
      properties:
        newPrice:
          $ref: "#/components/schemas/Money"
        expectedPrice:
          $ref: "#/components/schemas/Money"
        priceVersion:
          type: integer
          minimum: 1
          maximum: 2147483647
        confirmSimulatedPayment:
          type: boolean
      example:
        newPrice: "135.00"
        expectedPrice: "130.00"
        priceVersion: 1
        confirmSimulatedPayment: true
